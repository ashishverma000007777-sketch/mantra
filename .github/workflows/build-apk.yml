name: Build Mantra Android APK

on:
  workflow_dispatch:

jobs:
  build_apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Scaffold Android platform structure if needed
        run: |
          if [ ! -f "android/build.gradle" ] && [ ! -f "android/build.gradle.kts" ]; then
            echo "Scaffolding Android platform structure for in.mantraapp..."
            mkdir -p /tmp/mantra_android_backup
            cp -r android/app/src/main/* /tmp/mantra_android_backup/
            flutter create . --platforms=android --org in.mantraapp --project-name mantra
            # Remove auto-generated sample widget test from flutter create
            rm -f test/widget_test.dart
            # Restore custom files (MainActivity, ScreenshotPrevention, AndroidManifest, res)
            cp -r /tmp/mantra_android_backup/* android/app/src/main/
            # Configure Android Gradle files (Kotlin 1.9.22, R8 8.2.24, minSdk 23, exifinterface 1.3.7)
            python3 scripts/configure_android.py
          fi

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Run Flutter analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run Flutter tests
        run: flutter test

      - name: Build Android Debug APK
        run: flutter build apk --debug

      - name: Verify APK build & calculate SHA-256
        id: verify
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK not found at $APK_PATH" >&2
            exit 1
          fi
          APK_SIZE=$(stat -c%s "$APK_PATH" 2>/dev/null || stat -f%z "$APK_PATH")
          if [ "$APK_SIZE" -le 0 ]; then
            echo "ERROR: APK file size is 0 bytes" >&2
            exit 1
          fi
          SHA256=$(sha256sum "$APK_PATH" | awk '{print $1}')
          echo "=========================================="
          echo "APK Verification Succeeded"
          echo "Path: $APK_PATH"
          echo "Size: $APK_SIZE bytes"
          echo "SHA-256: $SHA256"
          echo "=========================================="
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "apk_size=$APK_SIZE" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mantra-debug-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
          if-no-files-found: error
